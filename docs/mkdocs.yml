site_name: AI Ghost
site_description: AI Ghost - an AI agent, the AI Ghost Writer, writes your book chapter by chapter.
# Must include the mike version segment (here the "latest" alias): mike deploys every version
# under /ai-ghost/<version>/, so links derived from site_url need that segment.
site_url: https://kleinerhacker.github.io/ai-ghost/latest/
repo_name: ai-ghost
repo_url: https://github.com/KleinerHacker/ai-ghost
docs_dir: docs
site_dir: ../build/docs

theme:
  name: material
  logo: assets/images/icon.png
  favicon: assets/images/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

nav:
  - Home: index.md
  - API Docs: dokka/html/index.html
  - Licences: licences/index.html
